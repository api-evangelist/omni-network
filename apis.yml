name: Omni Network
description: >-
  Omni Network is a crypto interoperability protocol that makes the entire
  multi-chain ecosystem feel like a single chain for users and developers. Its
  core product, SolverNet, is a network of solvers that fulfill cross-chain
  intents on a user's behalf, letting a dApp deployed on one chain be used by
  people whose funds live on another. Developers integrate SolverNet through the
  Omni SDK (the @omni-network/core and @omni-network/react TypeScript packages)
  to bridge, swap, deposit, and bundle arbitrary contract calls across any
  supported chain from a single frontend. The project is built on a Go/Cosmos-SDK
  monorepo with Solidity contracts and ships the OMNI ERC-20 token on Ethereum
  L1. In 2026 the company rebranded from Omni to Nomina, consolidated on
  Ethereum, and now also operates Nomina, a unified trading terminal for power
  users trading perpetual futures across decentralized exchanges. It is backed by
  Pantera Capital, Coinbase Ventures, Jump Crypto, Two Sigma, Spartan Group, and
  Vessel.
